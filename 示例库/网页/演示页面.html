<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HTML 预览演示</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: rgba(255,255,255,.12); backdrop-filter: blur(8px); border-radius: 16px; padding: 40px 56px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { opacity: .85; margin: 0 0 20px; }
  button { background: #fff; color: #5b4bb5; border: none; border-radius: 999px; padding: 10px 26px; font-size: 15px; cursor: pointer; font-family: inherit; }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #out { margin-top: 16px; font-size: 14px; min-height: 20px; opacity: .9; }
</style>
</head>
<body>
  <div class="card">
    <h1>这是真实渲染的网页 🌐</h1>
    <p>双击 HTML 文件即可预览，切「源码」还能直接改。</p>
    <button onclick="say()">点我试试</button>
    <div id="out"></div>
  </div>
<script>
  const words = ['Hi！HTML 预览正常 ✅', 'JS 也能跑 ✅', '在管理器里看网页，不需要开别的软件'];
  let i = 0;
  function say() { document.getElementById('out').textContent = words[i++ % words.length]; }
</script>
</body>
</html>
